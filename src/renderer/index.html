<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenza</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-bar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">A</span>
          <div>
            <h1>Agenza</h1>
            <p>Codex workspace</p>
          </div>
        </div>
        <div class="workspace-actions">
          <div class="workspace-status" aria-label="Workspace status" aria-live="polite">
            <span class="status-dot" aria-hidden="true"></span>
            <span data-terminal-count>No terminals</span>
          </div>
          <button class="add-terminal-button" type="button" data-add-terminal>
            <span aria-hidden="true">+</span>
            Add terminal
          </button>
        </div>
      </header>

      <main
        class="terminal-grid"
        data-terminal-grid
        data-terminal-count="0"
        data-workspace-ready="false"
        aria-label="Codex terminal workspace"
        aria-describedby="terminal-keyboard-help"
        aria-keyshortcuts="F6 Shift+F6"
      >
        <span class="visually-hidden" id="terminal-keyboard-help">
          Press F6 to focus the next terminal or Shift plus F6 to focus the previous terminal.
        </span>
        <section class="empty-workspace" data-empty-workspace>
          <span class="empty-workspace-mark" aria-hidden="true">&gt;_</span>
          <h2>No terminals open</h2>
          <p>Add a terminal to choose a project folder and start Codex.</p>
          <button class="empty-workspace-action" type="button" data-empty-add-terminal>
            Add terminal
          </button>
        </section>
      </main>

      <template id="terminal-pane-template">
        <section class="terminal-pane" data-session-state="waiting">
          <header class="pane-header">
            <div class="pane-identity">
              <span class="pane-number" aria-hidden="true" data-terminal-number></span>
              <div>
                <h2 data-terminal-title></h2>
                <p data-terminal-description>Choose a project folder</p>
              </div>
            </div>
            <div class="pane-actions">
              <button
                class="pane-action-button pane-project-button"
                type="button"
                data-project-button
              >
                Choose folder
              </button>
              <button class="pane-action-button" type="button" data-copy-button disabled>
                Copy
              </button>
              <button class="pane-action-button" type="button" data-paste-button disabled>
                Paste
              </button>
              <button class="pane-action-button" type="button" data-clear-button>Clear</button>
              <button class="pane-action-button" type="button" data-restart-button disabled>
                Restart
              </button>
              <button
                class="pane-action-button pane-remove-button"
                type="button"
                data-remove-button
              >
                Remove
              </button>
              <span
                class="pane-state"
                role="status"
                aria-atomic="true"
                aria-live="polite"
                data-terminal-state
              >
                Waiting
              </span>
            </div>
          </header>
          <div class="terminal-frame">
            <div class="terminal-mount" data-terminal-mount></div>
          </div>
        </section>
      </template>

      <footer class="status-bar">
        <span>Local workspace</span>
        <span class="keyboard-hint">
          <kbd>Ctrl+C</kbd> copy selection · <kbd>Ctrl+V</kbd> paste · <kbd>F6</kbd> switch
        </span>
        <span id="environment"></span>
      </footer>
    </div>
  </body>
</html>
